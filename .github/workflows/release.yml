name: Release

# Publishes to npm when a version tag is pushed.
#
# Publishing happens here rather than from a laptop because package.json sets
# `publishConfig.provenance`, and npm provenance requires an OIDC id-token that
# only a CI runner can mint. A local `npm publish` would fail, and dropping
# provenance to work around that would weaken exactly the supply-chain claim
# SECURITY.md makes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          # No `cache: npm`: this job holds the npm token and mints the
          # provenance id-token, so it must not restore a cache that other
          # workflow runs can write. Four lockfile entries install in seconds.

      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

      # dist/ is gitignored, so the published artifact is built here rather than
      # committed. This is also why a `git:` install of this repo cannot work --
      # there is no dist/ to point `openclaw.extensions` at.
      - run: npm run build

      - name: The built plugin entry exists
        # package.json's openclaw.extensions points at dist/index.js. If the
        # build silently produced nothing, publishing would ship a package that
        # installs and then fails with "extension entry not found".
        run: test -f dist/index.js && test -f bin/belay.mjs

      - name: Package contents
        run: npm pack --dry-run

      # Moving a tag re-runs this workflow, and npm refuses to republish a
      # version that already exists. That failure is correct but cosmetic, and a
      # red X on the repo reads as broken CI to anyone arriving from a link.
      # Check first so a re-run is a no-op instead.
      - name: Is this version already on the registry?
        id: published
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "Already published: $name@$version"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not yet published: $name@$version"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm publish --access public
        if: steps.published.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish skipped
        if: steps.published.outputs.exists == 'true'
        run: echo "::notice::Version already on the registry; publish skipped. Bump the version to release."
